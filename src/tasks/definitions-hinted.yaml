# ============================================================
# Layer 1: Head-to-head — CLI with accurate usage hints
# Same tasks as definitions.yaml but CLI prompts include
# verified cheatsheets for notion-cli and slack-cli
# GitHub (gh) and Postgres (psql) need no hints.
